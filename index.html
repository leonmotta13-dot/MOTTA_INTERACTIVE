<script>
  /* ============================================================
     CONFIGURACIÓN
  ============================================================ */
  var MOTTA_CONFIG = {

    logo: "img/logo.jpeg",           // imagen del logo de la empresa, "img/logo.png"

    gaId: "",           // ID de Google Analytics 4,"G-XXXXXXXXXX" 

    linkDonacion: "https://vaki.co/es/vaki/desarrollo-de-tracto-colombia?utm_source=copy&utm_medium=toolbar&utm_campaign=v4",
    correo: "mottainteractive@gmail.com",         // correo de contacto

    juegos: [
      {
        nombre: "TRACTO COLOMBIA",
        precio: "NO DISPONIBLE",
        imagen: "img/Tractocolombia.jpeg",
        linkCompra: ""
      },
      {
        nombre: "NEO/RETRO SIMULATOR",
        precio: "50% OFF",
        imagen: "img/neo-retro-simulator.jpeg",
        linkCompra: "https://motta-interactive.itch.io/neoretro"
      }
    ],

    /* Planes de páginas web: solo se usan para armar el correo de cotización.
       Los textos y precios que se ven están en el HTML de la sección #m-servicios. */
    planes: [
      { nombre: "Plan Básico",  precio: "300.000 COP" },
      { nombre: "Plan Pro",     precio: "400.000 COP" },
      { nombre: "Plan Premium", precio: "600.000 COP" }
    ]
  };

  /* ============================================================
                            LÓGICA
  ============================================================ */
  var MOTTA = {

    gaCargado: false,

    aviso: function (texto) {
      var el = document.getElementById("m-aviso");
      if (!el) return;
      el.textContent = texto;
      el.classList.add("ver");
      clearTimeout(window.__mottaT);
      window.__mottaT = setTimeout(function () { el.classList.remove("ver"); }, 2800);
    },

    abrir: function (url) {
      var w = window.open(url, "_blank");
      if (!w) { window.location.href = url; }
    },

    comprar: function (i) {
      var j = MOTTA_CONFIG.juegos[i];
      if (j && j.linkCompra) { MOTTA.abrir(j.linkCompra); }
      else { MOTTA.aviso("El enlace de compra de " + (j ? j.nombre : "este juego") + " estará disponible pronto."); }
      return false;
    },

    /*  abre un correo de cotización según el plan elegido */
    cotizar: function (i) {
      var p = MOTTA_CONFIG.planes[i];
      if (!p) return false;
      if (!MOTTA_CONFIG.correo) {
        MOTTA.aviso("El correo de contacto estará disponible pronto.");
        return false;
      }
      var asunto = "Cotización página web - " + p.nombre;
      var cuerpo = "Hola, me interesa el " + p.nombre + " (" + p.precio + ") para mi negocio.\n\n" +
                   "Nombre:\nTipo de negocio:\nCiudad:\n\nGracias.";
      window.location.href = "mailto:" + MOTTA_CONFIG.correo +
        "?subject=" + encodeURIComponent(asunto) +
        "&body=" + encodeURIComponent(cuerpo);
      return false;
    },

    donar: function () {
      if (MOTTA_CONFIG.linkDonacion) { MOTTA.abrir(MOTTA_CONFIG.linkDonacion); }
      else { MOTTA.aviso("El enlace de donación estará disponible pronto."); }
      return false;
    },

    escribir: function () {
      if (MOTTA_CONFIG.correo) { window.location.href = "mailto:" + MOTTA_CONFIG.correo; }
      else { MOTTA.aviso("El correo de contacto estará disponible pronto."); }
      return false;
    },

    /* ---------- VENTANA DE POLÍTICAS ---------- */
    politica: function (nombre) {
      var tpl = document.getElementById("pol-" + nombre);
      var cont = document.getElementById("m-modal-contenido");
      if (!tpl || !cont) return false;
      cont.innerHTML = "";
      cont.appendChild(tpl.content.cloneNode(true));
      var correo = MOTTA_CONFIG.correo || "(correo de contacto de MOTTA INTERACTIVE)";
      cont.querySelectorAll(".js-correo").forEach(function (el) { el.textContent = correo; });
      var modal = document.getElementById("m-modal");
      modal.classList.add("ver");
      modal.querySelector(".m-modal-caja").scrollTop = 0;
      document.body.style.overflow = "hidden";
      return false;
    },

    cerrar: function () {
      document.getElementById("m-modal").classList.remove("ver");
      document.body.style.overflow = "";
      return false;
    },

    /* ---------- COOKIES Y GOOGLE ANALYTICS ---------- */
    leerDecision: function () {
      try { return localStorage.getItem("motta_cookies"); } catch (e) { return null; }
    },

    guardarDecision: function (valor) {
      try { localStorage.setItem("motta_cookies", valor); } catch (e) {}
    },

    cargarAnalytics: function () {
      var id = MOTTA_CONFIG.gaId;
      if (!id || MOTTA.gaCargado) return;
      MOTTA.gaCargado = true;
      window["ga-disable-" + id] = false;
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date());
      window.gtag("config", id);
    },

    borrarCookiesAnalytics: function () {
      var partes = location.hostname.split(".");
      var dominios = ["", location.hostname, "." + location.hostname];
      if (partes.length > 2) dominios.push("." + partes.slice(-2).join("."));
      document.cookie.split(";").forEach(function (c) {
        var nombre = c.split("=")[0].trim();
        if (nombre.indexOf("_ga") === 0) {
          dominios.forEach(function (d) {
            document.cookie = nombre + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/" + (d ? "; domain=" + d : "");
          });
        }
      });
    },

    cookies: function (acepta) {
      MOTTA.guardarDecision(acepta ? "si" : "no");
      document.getElementById("m-cookies").classList.remove("ver");
      if (acepta) {
        MOTTA.cargarAnalytics();
        MOTTA.aviso("Gracias. Cookies de analítica activadas.");
      } else {
        if (MOTTA_CONFIG.gaId) window["ga-disable-" + MOTTA_CONFIG.gaId] = true;
        MOTTA.borrarCookiesAnalytics();
        MOTTA.aviso("Entendido. No usaremos cookies de analítica.");
      }
      return false;
    },

    verCookies: function () {
      if (!MOTTA_CONFIG.gaId) {
        MOTTA.aviso("Por ahora esta página no usa cookies de analítica.");
        return false;
      }
      document.getElementById("m-cookies").classList.add("ver");
      return false;
    },

    iniciar: function () {
      var C = MOTTA_CONFIG;

      if (C.logo) {
        document.querySelectorAll("[data-logo]").forEach(function (el) {
          el.style.backgroundImage = "url('" + C.logo + "')";
          el.textContent = "";
        });
      }

      C.juegos.forEach(function (j, i) {
        var card = document.getElementById("juego" + (i + 1));
        if (!card) return;
        card.querySelector("[data-nombre]").textContent = j.nombre;
        if (j.precio) card.querySelector("[data-precio]").textContent = j.precio;
        if (j.imagen) {
          var img = card.querySelector("[data-img]");
          img.style.backgroundImage = "url('" + j.imagen + "')";
          img.textContent = "";
        }
      });

      if (C.correo) document.getElementById("m-correo").textContent = C.correo;
      document.getElementById("m-year").textContent = new Date().getFullYear();

      /* Cookies: solo se pregunta (y se carga Analytics) si hay un ID configurado */
      if (C.gaId) {
        var decision = MOTTA.leerDecision();
        if (decision === "si") { MOTTA.cargarAnalytics(); }
        else if (decision !== "no") { document.getElementById("m-cookies").classList.add("ver"); }
      }

      /* Cerrar la ventana con Escape o haciendo clic fuera */
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") MOTTA.cerrar(); });
      document.getElementById("m-modal").addEventListener("click", function (e) {
        if (e.target === this) MOTTA.cerrar();
      });
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", MOTTA.iniciar);
  } else {
    MOTTA.iniciar();
  }
</script>
