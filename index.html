<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOTTA INTERACTIVE | Ideas que se convierten en videojuegos</title>
  <meta name="description" content="MOTTA INTERACTIVE: ideas que se convierten en videojuegos. Descubre nuestros juegos, contáctanos o apoya el desarrollo.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #070707;
      --black-2: #0f0f0f;
      --black-3: #171717;
      --gold: #d4af37;
      --gold-light: #f6e27a;
      --gold-dark: #9c7a1e;
      --text: #e9e4d4;
      --muted: #9a9486;
      --line: rgba(212, 175, 55, 0.22);
      --gold-grad: linear-gradient(135deg, #f6e27a 0%, #d4af37 45%, #9c7a1e 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1, h2, h3 { font-family: 'Playfair Display', serif; line-height: 1.15; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .gold-text {
      background: var(--gold-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container { width: min(1180px, 92%); margin: 0 auto; }

    /* ---------- NAV ---------- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(7, 7, 7, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 70px;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-weight: 700; font-size: 1.4rem; letter-spacing: 1px;
    }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a {
      font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); transition: color .3s; position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; left: 0; bottom: -6px;
      width: 0; height: 1px; background: var(--gold); transition: width .3s;
    }
    .nav-links a:hover { color: var(--gold-light); }
    .nav-links a:hover::after { width: 100%; }

    .menu-btn {
      display: none; background: none; border: 1px solid var(--line);
      color: var(--gold); font-size: 1.4rem; padding: 4px 12px;
      border-radius: 6px; cursor: pointer;
    }

    /* ---------- HERO ---------- */
    .hero {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; position: relative; padding: 120px 0 80px;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(212,175,55,.16), transparent 60%),
        radial-gradient(ellipse at 80% 90%, rgba(212,175,55,.08), transparent 50%),
        var(--black);
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 70px 70px;
      opacity: .12;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
    }
    .hero-content { position: relative; z-index: 1; }
    .eyebrow {
      display: inline-block; font-size: .78rem; letter-spacing: 4px;
      text-transform: uppercase; color: var(--gold);
      border: 1px solid var(--line); padding: 8px 20px; border-radius: 50px;
      margin-bottom: 28px;
    }
    .hero h1 { font-size: clamp(2.8rem, 8vw, 6rem); font-weight: 900; margin-bottom: 24px; }
    .hero p {
      max-width: 620px; margin: 0 auto 40px;
      color: var(--muted); font-size: 1.1rem; font-weight: 300;
    }
    .hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .btn {
      display: inline-block; padding: 14px 34px; border-radius: 50px;
      font-size: .85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border: 1px solid transparent; transition: all .35s;
      font-family: 'Inter', sans-serif;
    }
    .btn-gold { background: var(--gold-grad); color: #111; box-shadow: 0 8px 30px rgba(212,175,55,.25); }
    .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(212,175,55,.4); }
    .btn-outline { border-color: var(--gold); color: var(--gold-light); background: transparent; }
    .btn-outline:hover { background: rgba(212,175,55,.1); transform: translateY(-3px); }

    .scroll-hint {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      color: var(--gold); font-size: .7rem; letter-spacing: 3px; text-transform: uppercase;
      animation: float 2.2s ease-in-out infinite; opacity: .7;
    }
    @keyframes float { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 10px); } }

    /* ---------- SECCIONES ---------- */
    section { padding: 110px 0; position: relative; }
    .section-head { text-align: center; margin-bottom: 70px; }
    .section-head .eyebrow { margin-bottom: 18px; }
    .section-head h2 { font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 16px; }
    .section-head p { color: var(--muted); max-width: 560px; margin: 0 auto; font-weight: 300; }
    .divider {
      width: 80px; height: 2px; background: var(--gold-grad);
      margin: 22px auto 0; border-radius: 2px;
    }

    /* ---------- JUEGOS ---------- */
    #juegos { background: var(--black-2); }
    .games-grid {
      display: grid; gap: 34px;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    }
    .game-card {
      background: var(--black-3); border: 1px solid var(--line);
      border-radius: 18px; overflow: hidden; transition: transform .4s, box-shadow .4s, border-color .4s;
      display: flex; flex-direction: column;
    }
    .game-card:hover {
      transform: translateY(-10px);
      border-color: var(--gold);
      box-shadow: 0 25px 60px rgba(0,0,0,.6), 0 0 40px rgba(212,175,55,.15);
    }
    /* Reemplaza las rutas img/... por tus capturas. Si no existen, se ve el degradado dorado. */
    .game-media {
      height: 220px; position: relative; overflow: hidden;
      background-size: cover; background-position: center;
    }
    .game-media::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, var(--black-3), transparent 60%);
    }
    .media-icon {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 4rem; z-index: 0; opacity: .35;
    }
    .badge {
      position: absolute; top: 16px; right: 16px; z-index: 2;
      background: rgba(7,7,7,.8); border: 1px solid var(--gold);
      color: var(--gold-light); font-size: .68rem; letter-spacing: 2px;
      text-transform: uppercase; padding: 5px 14px; border-radius: 50px;
    }
    .game-body { padding: 26px 28px 30px; display: flex; flex-direction: column; flex: 1; }
    .game-body h3 { font-size: 1.55rem; margin-bottom: 10px; }
    .game-body p { color: var(--muted); font-size: .95rem; font-weight: 300; margin-bottom: 18px; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .tags span {
      font-size: .7rem; letter-spacing: 1px; text-transform: uppercase;
      color: var(--gold); border: 1px solid var(--line); padding: 3px 12px; border-radius: 50px;
    }
    .game-link {
      color: var(--gold-light); font-size: .82rem; letter-spacing: 2px;
      text-transform: uppercase;
